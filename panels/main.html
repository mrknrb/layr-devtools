<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>My plugins</title>
    <link rel="stylesheet" href="/_layr/layr.css" />
    <style>
      body { display: grid; place-items: center; min-height: 100vh; margin: 0; }
      .moved { max-width: 420px; padding: 24px; text-align: center; display: grid; gap: 12px; justify-items: center; }
      .moved h1 { font-size: 16px; margin: 0; }
      .moved p { margin: 0; }
    </style>
    <script src="/_layr/layr.js"></script>
    <script type="module" src="./main.js"></script>
  </head>
  <body>
    <!-- My plugins is part of layr now (0.2.0): only old saved layouts still open this tab. -->
    <div class="moved">
      <h1>My plugins is part of layr now</h1>
      <p class="layr-muted">Each plugin's history with undo, versions, updates and sharing on GitHub are on its page in the Plugins list.</p>
      <button class="layr-button primary" id="open">Open Plugins</button>
      <p class="layr-muted small" id="error" hidden></p>
    </div>
  </body>
</html>
