<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>My plugins</title>
    <link rel="stylesheet" href="/_layr/layr.css" />
    <link rel="stylesheet" href="./main.css" />
    <script src="/_layr/layr.js"></script>
    <script type="module" src="./main.js"></script>
  </head>
  <body>
    <div class="app" id="app">
      <aside class="side" id="side">
        <div class="side-head">
          <strong>My plugins</strong>
          <span class="layr-spacer"></span>
          <button class="layr-button ghost icon" id="refresh" title="Refresh" aria-label="Refresh">
            <svg viewBox="0 0 24 24" width="16" height="16"><path d="M17.6 6.4A8 8 0 1 0 20 12h-2a6 6 0 1 1-1.8-4.2L13 11h7V4z" fill="currentColor" /></svg>
          </button>
        </div>
        <nav class="plugin-list" id="list" aria-label="Plugins"></nav>
        <button class="side-foot" id="githubNav" data-action="view-github">
          <svg viewBox="0 0 24 24" width="16" height="16"><path d="M12 2a10 10 0 0 0-3.2 19.5c.5.1.7-.2.7-.5v-1.8c-2.8.6-3.4-1.2-3.4-1.2-.5-1.2-1.1-1.5-1.1-1.5-.9-.6.1-.6.1-.6 1 .1 1.5 1 1.5 1 .9 1.5 2.4 1.1 3 .8.1-.6.4-1.1.6-1.3-2.2-.3-4.6-1.1-4.6-5 0-1.1.4-2 1-2.7-.1-.3-.4-1.3.1-2.7 0 0 .8-.3 2.7 1a9.4 9.4 0 0 1 5 0c1.9-1.3 2.7-1 2.7-1 .5 1.4.2 2.4.1 2.7.6.7 1 1.6 1 2.7 0 3.9-2.4 4.7-4.6 5 .4.3.7.9.7 1.9V21c0 .3.2.6.7.5A10 10 0 0 0 12 2z" fill="currentColor" /></svg>
          <span id="githubState">GitHub</span>
        </button>
      </aside>
      <main class="detail" id="detail"></main>
    </div>
    <div class="modal-back" id="modal" hidden>
      <div class="modal layr-card" role="dialog" aria-modal="true" id="modalBox"></div>
    </div>
  </body>
</html>
